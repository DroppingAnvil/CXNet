name: SonarQube
on:
  push:
    branches:
      - managed
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'zulu' # Alternative distribution options are available.
      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      # Tests are allowed to fail without aborting the build so that analysis still has
      # something to read. This is not only about reaching the Sonar step: the jacoco
      # report goal is bound to the test phase, so a hard test failure aborts the build
      # mid-phase and no coverage report is ever written. Surefire records the failures
      # either way, and the Test results step below fails the job on them.
      - name: Build and test
        run: mvn -B verify -Dmaven.test.failure.ignore=true

      - name: SonarQube analysis
        # Unconditional. Runs whether the build passed, failed, or the run was cancelled,
        # so SonarCloud always receives an analysis. always() is used rather than
        # !cancelled() specifically so a cancelled run still uploads.
        if: always()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=DroppingAnvil_CXNet

      # Restores the red status that -Dmaven.test.failure.ignore=true suppressed, after
      # analysis has been uploaded. Without this the job would report green with failing
      # tests.
      - name: Test results
        if: ${{ !cancelled() }}
        run: |
          shopt -s nullglob
          reports=(target/surefire-reports/*.xml)
          if [ ${#reports[@]} -eq 0 ]; then
            echo "::warning::No surefire reports found; no tests ran."
            exit 0
          fi
          if grep -lE 'failures="[1-9]|errors="[1-9]' "${reports[@]}"; then
            echo "::error::Unit tests failed. Sonar analysis was still uploaded."
            exit 1
          fi
          echo "All tests passed."
